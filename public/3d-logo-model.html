<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiharStack 3D Gold Logo Model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #1f0f0c 0%, #0d0403 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .header-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #ffd700;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      letter-spacing: 1px;
      color: #fff;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    p {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(15, 7, 6, 0.85);
      padding: 10px 18px;
      border-radius: 50px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 10;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }
    .btn.active {
      background: #d4af37;
      color: #000;
      border-color: #d4af37;
    }
    .instruction {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(212, 175, 55, 0.8);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 4px 12px;
      border-radius: 12px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="header-bar">
    <div class="badge">Antigravity 3D Engine</div>
    <h1>BIHARSTACK 3D Model</h1>
    <p>Exact 1:1 Shape • PBR Metallic Gold • Real-time Lighting</p>
  </div>

  <div class="instruction">🖱️ Mouse se 360° Rotate & Zoom karein</div>

  <div class="controls-panel">
    <button class="btn active" id="btn-rotate">Auto Rotate: ON</button>
    <button class="btn" id="btn-front">Front View</button>
    <button class="btn" id="btn-iso">3D Isometric</button>
    <button class="btn" id="btn-side">Side 3D Depth</button>
    <button class="btn" id="btn-gold">Shimmer Pulse</button>
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d0403, 0.04);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 35;
    controls.minDistance = 8;

    // Lighting setup
    const ambientLight = new THREE.AmbientLight(0xffeedd, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffdf88, 2.5);
    mainLight.position.set(8, 12, 10);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const blueRimLight = new THREE.PointLight(0xff9944, 2.2, 30);
    blueRimLight.position.set(-10, -5, 8);
    scene.add(blueRimLight);

    const specularLight = new THREE.PointLight(0xffffff, 1.8, 20);
    specularLight.position.set(0, 8, 12);
    scene.add(specularLight);

    scene.add(logoGroup);

    img.onload = () => {
      // Create high-res canvas to process gold mask and depth
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      // Create bump/height map from gold pixels
      const bumpCanvas = document.createElement("canvas");
      bumpCanvas.width = canvas.width;
      bumpCanvas.height = canvas.height;
      const bCtx = bumpCanvas.getContext("2d");
      const bImgData = bCtx.createImageData(canvas.width, canvas.height);

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        // Detect dark background vs golden artwork
        const isGold = (r > 60 || g > 40) && !(r < 35 && g < 20 && b < 20);
        const brightness = (r * 0.299 + g * 0.587 + b * 0.114);
        const val = isGold ? Math.min(255, brightness * 1.4) : 0;
        
        bImgData.data[i] = val;
        bImgData.data[i+1] = val;
        bImgData.data[i+2] = val;
        bImgData.data[i+3] = isGold ? 255 : 0;
      }
      bCtx.putImageData(bImgData, 0, 0);

      const colorTexture = new THREE.CanvasTexture(canvas);
      colorTexture.generateMipmaps = true;

      const bumpTexture = new THREE.CanvasTexture(bumpCanvas);
      bumpTexture.generateMipmaps = true;

      // 3D Layer 1: Front Sculpted Gold Face (High Detail)
      const planeGeo = new THREE.PlaneGeometry(10, 10, 256, 256);
      const goldMat = new THREE.MeshStandardMaterial({
        map: colorTexture,
        bumpMap: bumpTexture,
        bumpScale: 0.35,
        displacementMap: bumpTexture,
        displacementScale: 0.45,
        metalness: 0.92,
        roughness: 0.22,
        transparent: true,
        alphaTest: 0.05,
        side: THREE.DoubleSide
      });
      const frontMesh = new THREE.Mesh(planeGeo, goldMat);
      frontMesh.position.z = 0.25;
      logoGroup.add(frontMesh);

      // 3D Layer 2: Extruded Deep Gold Slabs for authentic physical 3D Thickness
      const layersCount = 18;
      for (let l = 0; l < layersCount; l++) {
        const depthMat = new THREE.MeshStandardMaterial({
          map: colorTexture,
          bumpMap: bumpTexture,
          bumpScale: 0.15,
          color: new THREE.Color(0xb8860b).lerp(new THREE.Color(0x664400), l / layersCount),
          metalness: 0.95,
          roughness: 0.35,
          transparent: true,
          alphaTest: 0.1,
          side: THREE.DoubleSide
        });
        const layerMesh = new THREE.Mesh(planeGeo, depthMat);
        layerMesh.position.z = 0.25 - (l * 0.035);
        logoGroup.add(layerMesh);
      }

      // 3D Gold Rim Bevel Backing
      const backMat = new THREE.MeshStandardMaterial({
        map: colorTexture,
        color: 0x8b6508,
        metalness: 0.98,
        roughness: 0.4,
        transparent: true,
        alphaTest: 0.1,
        side: THREE.DoubleSide
      });
      const backMesh = new THREE.Mesh(planeGeo, backMat);
      backMesh.position.z = 0.25 - (layersCount * 0.035);
      logoGroup.add(backMesh);

      // 3D Circular Pedestal Stand
      const standGeo = new THREE.CylinderGeometry(6.5, 7.2, 0.6, 64);
      const standMat = new THREE.MeshStandardMaterial({
        color: 0x140a08,
        metalness: 0.8,
        roughness: 0.3,
      });
      const stand = new THREE.Mesh(standGeo, standMat);
      stand.position.set(0, -5.5, 0);
      stand.receiveShadow = true;
      scene.add(stand);

      // Golden ring trim on pedestal
      const ringGeo = new THREE.TorusGeometry(6.6, 0.08, 16, 100);
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.95,
        roughness: 0.2
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.set(0, -5.2, 0);
      scene.add(ring);
    };

    // Animation variables
    let autoRotate = true;
    let shimmer = false;
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (autoRotate) {
        logoGroup.rotation.y = Math.sin(elapsed * 0.6) * 0.45;
        logoGroup.rotation.x = Math.sin(elapsed * 0.4) * 0.08;
      }

      if (shimmer) {
        specularLight.position.x = Math.sin(elapsed * 3) * 10;
        specularLight.position.y = Math.cos(elapsed * 3) * 8 + 4;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // UI Buttons Handlers
    const btnRotate = document.getElementById("btn-rotate");
    btnRotate.addEventListener("click", () => {
      autoRotate = !autoRotate;
      btnRotate.textContent = autoRotate ? "Auto Rotate: ON" : "Auto Rotate: OFF";
      btnRotate.classList.toggle("active", autoRotate);
    });

    document.getElementById("btn-front").addEventListener("click", () => {
      autoRotate = false;
      btnRotate.textContent = "Auto Rotate: OFF";
      btnRotate.classList.remove("active");
      gsapAnimateCamera(0, 0, 18, 0, 0, 0);
    });

    document.getElementById("btn-iso").addEventListener("click", () => {
      autoRotate = false;
      btnRotate.textContent = "Auto Rotate: OFF";
      btnRotate.classList.remove("active");
      gsapAnimateCamera(10, 6, 14, 0, 0, 0);
    });

    document.getElementById("btn-side").addEventListener("click", () => {
      autoRotate = false;
      btnRotate.textContent = "Auto Rotate: OFF";
      btnRotate.classList.remove("active");
      gsapAnimateCamera(16, 2, 8, 0, 0, 0);
    });

    const btnGold = document.getElementById("btn-gold");
    btnGold.addEventListener("click", () => {
      shimmer = !shimmer;
      btnGold.classList.toggle("active", shimmer);
    });

    function gsapAnimateCamera(px, py, pz, tx, ty, tz) {
      camera.position.set(px, py, pz);
      controls.target.set(tx, ty, tz);
      controls.update();
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
